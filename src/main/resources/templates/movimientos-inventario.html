<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bitácora de Inventario - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Bitácora de Movimientos de Inventario</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card card-panel p-3">
        <table class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Fecha</th>
                <th>Medicamento</th>
                <th>Sucursal</th>
                <th>Tipo</th>
                <th>Cantidad</th>
                <th>Stock Anterior</th>
                <th>Stock Nuevo</th>
                <th>Usuario</th>
                <th>Referencia</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="mov : ${movimientos}">
                <td th:text="${#temporals.format(mov.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${mov.medicamentoNombre}"></td>
                <td th:text="${mov.sucursalNombre}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${#strings.contains(mov.tipo, 'ENTRADA')} ? 'bg-success' : 'bg-danger'"
                          th:text="${mov.tipo}">
                    </span>
                </td>
                <td th:text="${mov.cantidad}"></td>
                <td th:text="${mov.stockAnterior}"></td>
                <td th:text="${mov.stockNuevo}"></td>
                <td th:text="${mov.usuarioNombre}"></td>
                <td th:text="${mov.referencia}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(movimientos)}">
                <td colspan="9" class="text-center text-muted py-4">No hay movimientos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
