<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bitácora de Inventario - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-box-seam"></i> Bitácora de Movimientos de Inventario</h4>
        <div>
            <button type="button" class="btn btn-sistema" data-bs-toggle="modal" data-bs-target="#modalAjuste">
                <i class="bi bi-plus-circle"></i> Registrar Ajuste Manual
            </button>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorNegocio}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorNegocio}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card card-panel p-3">
        <table id="tablaMovimientos" class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Fecha</th>
                <th>Medicamento</th>
                <th>Sucursal</th>
                <th>Tipo</th>
                <th>Cantidad</th>
                <th>Stock Ant.</th>
                <th>Stock Nvo.</th>
                <th>Usuario</th>
                <th>Referencia</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="mov : ${movimientos}">
                <td th:text="${#temporals.format(mov.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${mov.medicamentoNombre}"></td>
                <td th:text="${mov.sucursalNombre}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${#strings.contains(mov.tipo, 'ENTRADA') or #strings.contains(mov.tipo, 'FISICO')} ? 'bg-success' : 'bg-danger'"
                          th:text="${mov.tipo}">
                    </span>
                </td>
                <td class="fw-bold text-center" th:text="${mov.cantidad}"></td>
                <td class="text-center" th:text="${mov.stockAnterior}"></td>
                <td class="text-center" th:text="${mov.stockNuevo}"></td>
                <td th:text="${mov.usuarioNombre}"></td>
                <td th:text="${mov.referencia}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para Ajuste Manual -->
<div class="modal fade" id="modalAjuste" tabindex="-1" aria-labelledby="modalAjusteLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/inventario/movimientos/guardar}" method="post">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalAjusteLabel">Registrar Ajuste de Inventario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Sucursal</label>
                    <select name="sucursalId" class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option th:each="suc : ${sucursales}" th:value="${suc.id}" th:text="${suc.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Medicamento</label>
                    <select name="medicamentoId" class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option th:each="med : ${medicamentos}" th:value="${med.id}" th:text="${med.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de Movimiento</label>
                    <select name="tipo" class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option value="ENTRADA_COMPRA">ENTRADA_COMPRA (Suma stock)</option>
                        <option value="AJUSTE_INVENTARIO_FISICO">AJUSTE_INVENTARIO_FISICO (Suma stock)</option>
                        <option value="SALIDA_AJUSTE">SALIDA_AJUSTE (Resta stock)</option>
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" name="cantidad" class="form-control" required min="1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Referencia (Ej. Fac. 123)</label>
                        <input type="text" name="referencia" class="form-control" maxlength="200">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Motivo</label>
                    <textarea name="motivo" class="form-control" rows="2" required maxlength="1000"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-sistema">Guardar Movimiento</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script>
    $(document).ready(function() {
        $('#tablaMovimientos').DataTable({
            "order": [ [ 0, "desc" ] ],
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
            }
        });
    });
</script>
</body>
</html>
