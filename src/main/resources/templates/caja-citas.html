<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cobro de Citas - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <!-- Título y botón de volver -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Cobro de Citas</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <!-- Formulario de Búsqueda -->
    <div class="card card-panel p-3 mb-3">
        <form th:action="@{/caja/citas}" method="get" class="d-flex gap-2">
            <input type="text" name="dpi" class="form-control"
                   placeholder="Ingresa DPI del paciente"
                   th:value="${dpiBuscado}" maxlength="13" inputmode="numeric" required>
            <button type="submit" class="btn btn-sistema"><i class="bi bi-search"></i> Buscar</button>
        </form>
    </div>

    <!-- Alerta de Error -->
    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <!-- Tabla de Resultados -->
    <div class="card card-panel p-3" th:if="${citas != null}">
        <table class="table table-sistema align-middle">
            <thead>
                <tr>
                    <th>Cita #</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Especialidad</th>
                    <th>Fecha y Hora</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citas}">
                    <td th:text="${cita.id}"></td>
                    <td th:text="${cita.pacienteNombre}"></td>
                    <td th:text="${cita.medicoNombre}"></td>
                    <td th:text="${cita.especialidadNombre}"></td>
                    <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="badge badge-estado bg-warning text-dark" th:text="${cita.estado}"></span></td>
                    <td>
                        <button type="button" class="btn btn-sistema btn-sm" data-bs-toggle="modal" data-bs-target="#pagoModal"
                                th:attr="data-cita-id=${cita.id}, data-paciente=${cita.pacienteNombre}, data-dpi=${cita.pacienteDpi}">
                            <i class="bi bi-cash-coin"></i> Cobrar
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(citas)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay citas pendientes de pago para el DPI ingresado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal de Pago -->
<div class="modal fade" id="pagoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/caja/citas/pagar}" method="post" id="formPago">
                <div class="modal-header">
                    <h5 class="modal-title">Cobrar Cita Médica</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="citaId" id="citaId">
                    <p class="mb-1"><strong>Paciente:</strong> <span id="pacientePago"></span></p>
                    <p class="mb-3"><strong>DPI:</strong> <span id="dpiPago"></span></p>
                    <div class="alert alert-info py-2">Total a cobrar: <strong id="montoPago">Q150.00</strong></div>
                    <div class="mb-3">
                        <label class="form-label">Método de pago</label>
                        <select name="metodoPago" id="metodoPago" class="form-select" required>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="VISA_CREDITO">Visa</option>
                            <option value="MASTERCARD">Mastercard</option>
                            <option value="DEBITO">Débito</option>
                        </select>
                    </div>
                    <div id="efectivoCampos" class="mb-3">
                        <label class="form-label">Monto recibido (Q)</label>
                        <input type="number" name="montoRecibido" id="montoRecibido" class="form-control" min="0.01" step="0.01">
                        <div class="form-text" id="cambio"></div>
                    </div>
                    <div id="tarjetaCampos" class="mb-3 d-none">
                        <label class="form-label">Últimos 4 dígitos de la tarjeta</label>
                        <input type="text" name="ultimosDigitosTarjeta" id="ultimosDigitosTarjeta" class="form-control" inputmode="numeric" pattern="[0-9]{4}" maxlength="4">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-sistema">Confirmar pago</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modalPago = document.getElementById('pagoModal');
    const total = 150.00; // Monto fijo por ahora

    modalPago.addEventListener('show.bs.modal', event => {
        const button = event.relatedTarget;
        document.getElementById('citaId').value = button.dataset.citaId;
        document.getElementById('pacientePago').textContent = button.dataset.paciente;
        document.getElementById('dpiPago').textContent = button.dataset.dpi;

        // Limpiar campos del modal
        document.getElementById('montoRecibido').value = '';
        document.getElementById('cambio').textContent = '';
        document.getElementById('ultimosDigitosTarjeta').value = '';
        actualizarMetodo();
    });

    function actualizarMetodo() {
        const esEfectivo = document.getElementById('metodoPago').value === 'EFECTIVO';
        document.getElementById('efectivoCampos').classList.toggle('d-none', !esEfectivo);
        document.getElementById('tarjetaCampos').classList.toggle('d-none', esEfectivo);
        document.getElementById('montoRecibido').required = esEfectivo;
        document.getElementById('ultimosDigitosTarjeta').required = !esEfectivo;
    }

    document.getElementById('metodoPago').addEventListener('change', actualizarMetodo);

    document.getElementById('montoRecibido').addEventListener('input', event => {
        const diferencia = Number(event.target.value || 0) - total;
        document.getElementById('cambio').textContent = diferencia < 0 ? 'El monto recibido es menor al total.' : 'Cambio a devolver: Q' + diferencia.toFixed(2);
    });

    document.getElementById('formPago').addEventListener('submit', event => {
        if (document.getElementById('metodoPago').value === 'EFECTIVO' && Number(document.getElementById('montoRecibido').value) < total) {
            event.preventDefault();
            alert('El monto recibido no puede ser menor al total a cobrar.');
        }
    });
</script>
</body>
</html>
