<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Paciente - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Nuevo Paciente</h4>
        <a th:href="@{/pacientes}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card card-panel p-4">

        <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

        <form th:action="@{/pacientes}" th:object="${pacienteRequest}" method="post">

            <div class="mb-3">
                <label class="form-label">DPI</label>
                <input type="text" th:field="*{dpi}" class="form-control"
                       maxlength="13" inputmode="numeric" pattern="[0-9]*"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 13)"
                       th:classappend="${#fields.hasErrors('dpi')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('dpi')}" th:errors="*{dpi}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" th:field="*{nombreCompleto}" class="form-control"
                       th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <div class="input-group">
                    <span class="input-group-text">+502</span>
                    <input type="text" th:field="*{telefono}" class="form-control"
                           maxlength="8" inputmode="numeric" pattern="[0-9]*"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8)"
                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" th:field="*{correo}" class="form-control"
                       th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Número de seguro (opcional)</label>
                <input type="text" th:field="*{numeroSeguro}" class="form-control">
            </div>

            <div class="mb-3 d-flex justify-content-between align-items-center">
                <span class="fw-semibold">Credenciales de acceso</span>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="generarCredenciales()">
                    <i class="bi bi-magic"></i> Generar automáticamente
                </button>
            </div>

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" th:field="*{username}" class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" th:field="*{password}" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-sistema w-100">
                <i class="bi bi-check-circle"></i> Registrar Paciente
            </button>
        </form>
    </div>
</div>

<script th:inline="javascript">
function generarCredenciales() {
    const nombreInput = document.querySelector('input[name="nombreCompleto"]').value.trim();
    const partes = nombreInput.split(' ').filter(p => p.length > 0);
    let base = partes.length >= 2 ? (partes[0][0] + partes[1]).toLowerCase() : 'usuario';
    base = base.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // quita acentos
    const numero = Math.floor(Math.random() * 90 + 10);
    const username = (base + numero).slice(0, 9);

    const caracteres = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
    let password = '';
    for (let i = 0; i < 14; i++) {
        password += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
    }

    document.querySelector('input[name="username"]').value = username;
    document.querySelector('input[name="password"]').value = password;

    alert('Usuario: ' + username + '\nContraseña: ' + password + '\n\nAnótala, no se mostrará de nuevo.');
}
</script>

</body>
</html>
