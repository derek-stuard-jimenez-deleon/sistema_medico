<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Citas - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Citas</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card card-panel p-3">
        <table class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Paciente</th>
                <th>Médico</th>
                <th>Especialidad</th>
                <th>Fecha y hora</th>
                <th>Sucursal</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.pacienteNombre}"></td>
                <td th:text="${cita.medicoNombre}"></td>
                <td th:text="${cita.especialidadNombre}"></td>
                <td th:text="${cita.fechaHora}"></td>
                <td th:text="${cita.sucursalNombre}"></td>
                <td>
                            <span class="badge badge-estado"
                                  th:classappend="${cita.estado == 'PAGADA'} ? 'bg-primary' :
                                                   (${cita.estado == 'RESERVADA'} ? 'bg-warning text-dark' :
                                                   (${cita.estado == 'ATENDIDA'} ? 'bg-success' :
                                                   (${cita.estado == 'CANCELADA'} ? 'bg-secondary' : 'bg-danger')))"
                                  th:text="${cita.estado}">
                            </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="6" class="text-center text-muted py-4">No hay citas registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
