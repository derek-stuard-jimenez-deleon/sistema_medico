<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="pantalla-login">
<div class="card card-login">
    <div class="card-body p-5">
        <div class="icono-login"><i class="bi bi-shield-lock-fill"></i></div>
        <h2 class="text-center mb-1 fw-bold">Nueva contraseña</h2>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div th:if="${exito}">
            <div class="alert alert-success">Tu contraseña se actualizó correctamente.</div>
            <a th:href="@{/login}" class="btn btn-sistema w-100">Ir al login</a>
        </div>

        <form th:if="${token != null and exito == null}" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" name="password" class="form-control" required minlength="12">
            </div>
            <div class="mb-4">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" name="confirmarPassword" class="form-control" required minlength="12">
            </div>
            <button type="submit" class="btn btn-sistema w-100">Cambiar contraseña</button>
        </form>
    </div>
</div>
</body>
</html>
