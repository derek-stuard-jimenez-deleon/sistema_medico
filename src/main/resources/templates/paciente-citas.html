<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Citas - Portal de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <!-- Título y botón de volver -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Mis Citas Médicas</h4>
        <div>
            <a th:href="@{/paciente/portal/citas/agendar}" class="btn btn-sistema btn-sm me-2">
                <i class="bi bi-calendar-plus"></i> Agendar Nueva Cita
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
    </div>

    <!-- Alerta de Éxito o Error -->
    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <!-- Tabla de Resultados -->
    <div class="card card-panel p-3">
        <h5 class="mb-3" th:if="${pacienteNombre}">Paciente: <span class="fw-bold" th:text="${pacienteNombre}"></span></h5>
        <table class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Cita #</th>
                <th>Médico</th>
                <th>Especialidad</th>
                <th>Fecha y Hora</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.id}"></td>
                <td th:text="${cita.medicoNombre}"></td>
                <td th:text="${cita.especialidadNombre}"></td>
                <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${#strings.equals(cita.estado, 'PAGADA')} ? 'bg-success' : (${#strings.equals(cita.estado, 'RESERVADA')} ? 'bg-warning text-dark' : (${#strings.equals(cita.estado, 'CANCELADA')} ? 'bg-danger' : (${#strings.equals(cita.estado, 'REAGENDADA')} ? 'bg-primary' : (${#strings.equals(cita.estado, 'PENDIENTE_PAGO')} ? 'bg-info' : (${#strings.equals(cita.estado, 'ATENDIDA')} ? 'bg-secondary' : 'bg-light text-dark')))))"
                          th:text="${cita.estado}">
                    </span>
                </td>
                <td>
                    <!-- Botón de Cancelar -->
                    <form th:action="@{/paciente/portal/citas/cancelar/{id}(id=${cita.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                th:disabled="${(!#strings.equals(cita.estado, 'RESERVADA') && !#strings.equals(cita.estado, 'REAGENDADA')) || cita.fechaHora.isBefore(#temporals.createNow())}"
                                onclick="return confirm('¿Está seguro que desea cancelar esta cita?');">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>
                    </form>
                    <!-- Botón de Reagendar (MODIFICADO) -->
                    <a th:href="@{/paciente/portal/citas/reagendar/{id}(id=${cita.id})}"
                       class="btn btn-sm btn-outline-secondary ms-1"
                       th:classappend="${!#strings.equals(cita.estado, 'RESERVADA') || cita.fechaHora.isBefore(#temporals.createNow()) ? 'disabled' : ''}"
                       th:attr="aria-disabled=${!#strings.equals(cita.estado, 'RESERVADA') || cita.fechaHora.isBefore(#temporals.createNow()) ? 'true' : 'false'}"
                       tabindex="${!#strings.equals(cita.estado, 'RESERVADA') || cita.fechaHora.isBefore(#temporals.createNow()) ? '-1' : '0'}">
                        <i class="bi bi-pencil"></i> Reagendar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="6" class="text-center text-muted py-4">No tienes citas agendadas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
