<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cobro de Laboratorio - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Cobro de Laboratorio</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
    <div class="card card-panel p-3 mb-3">
        <form th:action="@{/caja/laboratorio}" method="get" class="d-flex gap-2">
            <select name="criterio" id="criterioBusqueda" class="form-select" style="max-width: 180px;">
                <option value="DPI" th:selected="${criterio == 'DPI'}">Por DPI</option>
                <option value="ORDEN" th:selected="${criterio == 'ORDEN'}">Por No. orden</option>
            </select>
            <input type="text" name="valor" id="valorBusqueda" class="form-control"
                   th:placeholder="${criterio == 'ORDEN'} ? 'Ingresa número de orden' : 'Ingresa DPI del paciente'"
                   th:value="${valorBuscado}" maxlength="13" inputmode="numeric" required>
            <button type="submit" class="btn btn-sistema"><i class="bi bi-search"></i> Buscar</button>
        </form>
    </div>
    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>
    <div class="card card-panel p-3" th:if="${ordenes != null}">
        <table class="table table-sistema align-middle">
            <thead><tr><th>Orden #</th><th>Paciente</th><th>DPI</th><th>Médico</th><th>Exámenes</th><th>Monto total</th><th>Estado</th><th></th></tr></thead>
            <tbody>
            <tr th:each="orden : ${ordenes}">
                <td th:text="${orden.id}"></td>
                <td th:text="${orden.pacienteNombre}"></td>
                <td th:text="${orden.pacienteDpi}"></td>
                <td th:text="${orden.medicoNombre}"></td>
                <td><span th:each="det, iter : ${orden.detalles}"><span th:text="${det.examenNombre}"></span><span th:if="${!iter.last}">, </span></span></td>
                <td th:text="'Q' + ${orden.montoTotal}"></td>
                <td><span class="badge badge-estado bg-warning text-dark" th:text="${orden.estado}"></span></td>
                <td><button type="button" class="btn btn-sistema btn-sm" data-bs-toggle="modal" data-bs-target="#pagoModal" th:attr="data-orden-id=${orden.id},data-paciente=${orden.pacienteNombre},data-dpi=${orden.pacienteDpi},data-monto=${orden.montoTotal}"><i class="bi bi-cash-coin"></i> Cobrar</button></td>
            </tr>
            <tr th:if="${#lists.isEmpty(ordenes)}"><td colspan="8" class="text-center text-muted py-4">No hay órdenes pendientes para el criterio ingresado.</td></tr>
            </tbody>
        </table>
    </div>
</main>
<div class="modal fade" id="pagoModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
    <form th:action="@{/caja/laboratorio/pagar}" method="post" id="formPago">
        <div class="modal-header"><h5 class="modal-title">Cobrar orden de laboratorio</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" name="ordenId" id="ordenId">
            <p class="mb-1"><strong>Paciente:</strong> <span id="pacientePago"></span></p><p class="mb-3"><strong>DPI:</strong> <span id="dpiPago"></span></p>
            <div class="alert alert-info py-2">Total a cobrar: <strong id="montoPago"></strong></div>
            <div class="mb-3"><label class="form-label">Método de pago</label><select name="metodoPago" id="metodoPago" class="form-select" required><option value="EFECTIVO">Efectivo</option><option value="VISA_CREDITO">Visa</option><option value="MASTERCARD">Mastercard</option><option value="DEBITO">Débito</option></select></div>
            <div id="efectivoCampos" class="mb-3"><label class="form-label">Monto recibido (Q)</label><input type="number" name="montoRecibido" id="montoRecibido" class="form-control" min="0.01" step="0.01"><div class="form-text" id="cambio"></div></div>
            <div id="tarjetaCampos" class="mb-3 d-none"><label class="form-label">Últimos 4 dígitos de la tarjeta</label><input type="text" name="ultimosDigitosTarjeta" id="ultimosDigitosTarjeta" class="form-control" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-sistema">Confirmar pago</button></div>
    </form>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const modalPago = document.getElementById('pagoModal'); let total = 0;
const criterioBusqueda = document.getElementById('criterioBusqueda');
const valorBusqueda = document.getElementById('valorBusqueda');
function actualizarCampoBusqueda() {
    const esOrden = criterioBusqueda.value === 'ORDEN';
    valorBusqueda.placeholder = esOrden ? 'Ingresa número de orden' : 'Ingresa DPI del paciente';
    valorBusqueda.maxLength = esOrden ? 19 : 13;
    valorBusqueda.value = '';
}
criterioBusqueda.addEventListener('change', actualizarCampoBusqueda);
valorBusqueda.addEventListener('input', () => valorBusqueda.value = valorBusqueda.value.replace(/\D/g, ''));
modalPago.addEventListener('show.bs.modal', event => { const button = event.relatedTarget; total = Number(button.dataset.monto); document.getElementById('ordenId').value = button.dataset.ordenId; document.getElementById('pacientePago').textContent = button.dataset.paciente; document.getElementById('dpiPago').textContent = button.dataset.dpi; document.getElementById('montoPago').textContent = 'Q' + total.toFixed(2); document.getElementById('montoRecibido').value = ''; document.getElementById('cambio').textContent = ''; document.getElementById('ultimosDigitosTarjeta').value = ''; actualizarMetodo(); });
function actualizarMetodo() { const efectivo = document.getElementById('metodoPago').value === 'EFECTIVO'; document.getElementById('efectivoCampos').classList.toggle('d-none', !efectivo); document.getElementById('tarjetaCampos').classList.toggle('d-none', efectivo); document.getElementById('montoRecibido').required = efectivo; document.getElementById('ultimosDigitosTarjeta').required = !efectivo; }
document.getElementById('metodoPago').addEventListener('change', actualizarMetodo);
document.getElementById('montoRecibido').addEventListener('input', event => { const diferencia = Number(event.target.value || 0) - total; document.getElementById('cambio').textContent = diferencia < 0 ? 'El monto recibido es menor al total.' : 'Cambio a devolver: Q' + diferencia.toFixed(2); });
document.getElementById('formPago').addEventListener('submit', event => { if (document.getElementById('metodoPago').value === 'EFECTIVO' && Number(document.getElementById('montoRecibido').value) < total) event.preventDefault(); });
</script>
</body>
</html>
