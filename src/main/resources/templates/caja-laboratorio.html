<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cobro de Laboratorio - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Cobro de Laboratorio</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card card-panel p-3 mb-3">
        <form th:action="@{/caja/laboratorio}" method="get" class="d-flex gap-2">
            <input type="text" name="dpi" class="form-control" placeholder="Ingresa el DPI del paciente"
                   th:value="${dpiBuscado}" maxlength="13">
            <button type="submit" class="btn btn-sistema"><i class="bi bi-search"></i> Buscar</button>
        </form>
    </div>

    <div class="card card-panel p-3" th:if="${ordenes != null}">
        <table class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Orden #</th>
                <th>Médico</th>
                <th>Exámenes</th>
                <th>Monto Total</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="orden : ${ordenes}">
                <td th:text="${orden.id}"></td>
                <td th:text="${orden.medicoNombre}"></td>
                <td>
                            <span th:each="det, iter : ${orden.detalles}">
                                <span th:text="${det.examenNombre}"></span><span th:if="${!iter.last}">, </span>
                            </span>
                </td>
                <td th:text="'Q' + ${orden.montoTotal}"></td>
                <td><span class="badge badge-estado bg-warning text-dark" th:text="${orden.estado}"></span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(ordenes)}">
                <td colspan="5" class="text-center text-muted py-4">No hay órdenes pendientes para este DPI.</td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted small mt-2">
            <i class="bi bi-info-circle"></i>
            El cobro se registra desde la API (POST /api/pagos) con tipoOrigen "LABORATORIO" y el id de la orden como referenciaId.
        </p>
    </div>
</div>
</body>
</html>
