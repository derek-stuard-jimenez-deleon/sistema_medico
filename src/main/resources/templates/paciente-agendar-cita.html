<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Nueva Cita - Portal de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0" th:text="${citaOriginalId != null ? 'Reagendar Cita' : 'Agendar Nueva Cita'}">Agendar Nueva Cita</h4>
        <a th:href="@{/paciente/portal/citas}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver a Mis Citas</a>
    </div>

    <div class="card card-panel p-4 mx-auto" style="max-width: 720px;">
        <!-- Alerta para errores de negocio -->
        <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

        <form th:action="${citaOriginalId != null ? '/paciente/portal/citas/reagendar/' + citaOriginalId : '/paciente/portal/citas/agendar'}" th:object="${citaRequest}" method="post">
            <!-- Campo oculto para el ID de la cita original en caso de reagendamiento -->
            <input type="hidden" id="citaOriginalId" th:value="${citaOriginalId}" />

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <select id="especialidad" th:field="*{especialidadId}" class="form-select"
                            th:classappend="${#fields.hasErrors('especialidadId')} ? 'is-invalid' : ''" required>
                        <option value="">Seleccione una especialidad</option>
                        <option th:each="especialidad : ${especialidades}"
                                th:value="${especialidad.id}"
                                th:text="${especialidad.nombre}">
                            Medicina General
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('especialidadId')}" th:errors="*{especialidadId}"></div>
                </div>

                <div class="col-md-6">
                    <label for="medico" class="form-label">Médico</label>
                    <select id="medico" th:field="*{medicoId}" class="form-select"
                            th:classappend="${#fields.hasErrors('medicoId')} ? 'is-invalid' : ''" required>
                        <option value="">Seleccione un médico</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('medicoId')}" th:errors="*{medicoId}"></div>
                </div>

                <div class="col-md-6">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input type="date" id="fecha" class="form-control"
                           th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}"></div>
                </div>

                <div class="col-md-6">
                    <label for="hora" class="form-label">Hora Disponible</label>
                    <select id="hora" class="form-select" required disabled>
                        <option value=""></option>
                    </select>
                </div>

                <!-- Campo oculto que combina fecha + hora para enviar como fechaHora -->
                <input type="hidden" id="fechaHora" th:field="*{fechaHora}" />

                <div class="col-12">
                    <label for="motivo" class="form-label">Motivo de la Cita (Opcional)</label>
                    <textarea id="motivo" th:field="*{motivoVisita}" class="form-control" rows="3"
                              th:classappend="${#fields.hasErrors('motivoVisita')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('motivoVisita')}" th:errors="*{motivoVisita}"></div>
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end gap-2">
                <button type="submit" class="btn btn-sistema" th:text="${citaOriginalId != null ? 'Reagendar Cita' : 'Agendar Cita'}">Agendar Cita</button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Establecer fecha mínima hoy
    document.addEventListener('DOMContentLoaded', function() {
        const fechaInput = document.getElementById('fecha');
        const ahora = new Date();
        const ano = ahora.getFullYear();
        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
        const dia = String(ahora.getDate()).padStart(2, '0');

        const minDate = `${ano}-${mes}-${dia}`;
        fechaInput.setAttribute('min', minDate);

        // Disparar el evento change en especialidad si ya tiene un valor (ej. al volver de un error de validación)
        const especialidadSelect = document.getElementById('especialidad');
        if (especialidadSelect.value) {
            especialidadSelect.dispatchEvent(new Event('change'));
        }
    });

    // Verificar si se cumplen las 3 condiciones para habilitar hora
    function verificarCondiciones() {
        const especialidadId = document.getElementById('especialidad').value;
        const medicoId = document.getElementById('medico').value;
        const fecha = document.getElementById('fecha').value;
        const horaSelect = document.getElementById('hora');

        if (especialidadId && medicoId && fecha) {
            // Habilitar el campo y cargar horarios
            horaSelect.disabled = false;
            cargarHorarios();
        } else {
            // Deshabilitar el campo si no se cumplen las condiciones
            horaSelect.disabled = true;
            horaSelect.innerHTML = '<option value=""></option>';
        }
    }

    // Cargar horarios cuando se selecciona especialidad y médico
    function cargarHorarios() {
        const fecha = document.getElementById('fecha').value;
        const medicoId = document.getElementById('medico').value;
        const especialidadId = document.getElementById('especialidad').value;
        const citaOriginalId = document.getElementById('citaOriginalId').value; // Obtener el ID de la cita original

        // Limpiar opciones anteriores
        const horaSelect = document.getElementById('hora');
        horaSelect.innerHTML = '<option value="">Cargando horarios...</option>';

        if (!fecha || !medicoId || !especialidadId) {
            horaSelect.innerHTML = '<option value=""></option>';
            return;
        }

        let url = `/paciente/portal/horarios-disponibles?fecha=${fecha}&medicoId=${medicoId}&especialidadId=${especialidadId}`;
        if (citaOriginalId) {
            url += `&citaId=${citaOriginalId}`; // Añadir citaId si estamos reagendando
        }

        fetch(url)
            .then(response => response.json())
            .then(horarios => {
                horaSelect.innerHTML = '<option value="">Seleccione una hora</option>';

                if (horarios.length === 0) {
                    horaSelect.innerHTML += '<option disabled>No hay horarios disponibles</option>';
                    return;
                }

                horarios.forEach(horario => {
                    const option = document.createElement('option');
                    option.value = horario.hora; // Formato: HH:MM
                    option.textContent = horario.hora + (horario.disponible ? '' : ' (Ocupado)');
                    option.disabled = !horario.disponible;

                    // Mostrar ocupados con fondo gris
                    if (!horario.disponible) {
                        option.style.backgroundColor = '#e9ecef';
                        option.style.color = '#999';
                    }

                    horaSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error cargando horarios:', error);
                horaSelect.innerHTML = '<option disabled>Error cargando horarios</option>';
            });
    }

    // Actualizar campo oculto fechaHora cuando se selecciona fecha y hora
    function actualizarFechaHora() {
        const fecha = document.getElementById('fecha').value;
        const hora = document.getElementById('hora').value;
        const fechaHoraInput = document.getElementById('fechaHora');

        if (fecha && hora) {
            // Combinar en formato ISO: YYYY-MM-DDTHH:MM:SS
            const fechaHoraCompleta = `${fecha}T${hora}:00`;
            fechaHoraInput.value = fechaHoraCompleta;
            console.log('FechaHora actualizada:', fechaHoraCompleta);
        } else {
            fechaHoraInput.value = ''; // Limpiar si no están completos
        }
    }

    // Event listeners
    document.getElementById('especialidad').addEventListener('change', verificarCondiciones);
    document.getElementById('medico').addEventListener('change', verificarCondiciones);
    document.getElementById('fecha').addEventListener('change', verificarCondiciones);
    document.getElementById('hora').addEventListener('change', actualizarFechaHora);

    // Carga inicial de médicos por especialidad
    document.getElementById('especialidad').addEventListener('change', function() {
        const especialidadId = this.value;

        if (especialidadId) {
            fetch(`/paciente/portal/medicos-por-especialidad?especialidadId=${especialidadId}`)
                .then(response => response.json())
                .then(medicos => {
                    const medicoSelect = document.getElementById('medico');
                    medicoSelect.innerHTML = '<option value="">Seleccione un médico</option>';
                    if (medicos.length === 0) {
                        medicoSelect.innerHTML += '<option disabled>No hay médicos disponibles</option>';
                    }
                    medicos.forEach(medico => {
                        const option = document.createElement('option');
                        option.value = medico.id;
                        option.text = medico.nombreCompleto;
                        medicoSelect.appendChild(option);
                    });
                    // Si ya hay un médico seleccionado (ej. al volver de un error), intentar cargar horarios
                    if (medicoSelect.value) {
                        verificarCondiciones();
                    }
                })
                .catch(error => console.error('Error cargando médicos:', error));
        } else {
            document.getElementById('medico').innerHTML = '<option value="">Seleccione un médico</option>';
        }
    });
</script>
</body>
</html>
