<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Empleado - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Médico 2026</a>
    </div>
</nav>

<div class="container mt-4 mb-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i th:class="${editMode != null && editMode} ? 'bi bi-person-gear text-warning' : 'bi bi-person-plus text-success'"></i>
            <span th:text="${editMode != null && editMode} ? ' Editar Empleado' : ' Nuevo Empleado'"></span>
        </h3>
        <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${editMode != null && editMode} ? @{/admin/usuarios/actualizar/{id}(id=${userId})} : @{/admin/usuarios/guardar}" th:object="${usuarioRequest}" method="post">
                
                <h5 class="fw-bold text-primary mb-3">Datos Personales</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre Completo <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{nombreCompleto}" class="form-control" required id="nombreCompletoInput">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">DPI</label>
                        <input type="text" th:field="*{dpi}" class="form-control" placeholder="13 dígitos" maxlength="13" minlength="13" pattern="\d{13}" th:readonly="${editMode != null && editMode}">
                    </div>
                </div>

                <h5 class="fw-bold text-primary mb-3 mt-4">Credenciales de Acceso</h5>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Username <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" th:field="*{username}" class="form-control" required id="usernameInput" maxlength="9" th:readonly="${editMode != null && editMode}">
                            <button th:if="${editMode == null || !editMode}" class="btn btn-outline-secondary" type="button" onclick="generarUsername()" title="Autogenerar">
                                <i class="bi bi-magic"></i>
                            </button>
                        </div>
                        <small th:if="${editMode == null || !editMode}" class="text-muted">Se puede autogenerar.</small>
                    </div>
                    
                    <div class="col-md-4" th:if="${editMode == null || !editMode}">
                        <label class="form-label fw-bold">Contraseña Inicial</label>
                        <input type="hidden" th:field="*{password}">
                        <input type="text" class="form-control bg-light" value="password123" disabled>
                        <small class="text-muted">Se pedirá cambiarla luego.</small>
                    </div>
                    
                    <div class="col-md-4" th:if="${editMode != null && editMode}">
                        <label class="form-label fw-bold text-warning"><i class="bi bi-key"></i> Nueva Contraseña</label>
                        <input type="text" th:field="*{password}" class="form-control border-warning">
                        <small class="text-muted">Borra el texto si NO deseas cambiarla.</small>
                    </div>

                    <div class="col-md-4" th:if="${editMode != null && editMode}">
                        <label class="form-label fw-bold">Estado</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" role="switch" th:field="*{activo}" id="activoSwitch">
                            <label class="form-check-label" for="activoSwitch">Activo</label>
                        </div>
                    </div>
                </div>

                <h5 class="fw-bold text-primary mb-3 mt-4">Asignación de Puesto</h5>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Rol <span class="text-danger">*</span></label>
                        <select th:field="*{rolId}" class="form-select" id="selectRol" required onchange="toggleEspecialidad()">
                            <option value="">-- Seleccione --</option>
                            <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(rol.nombre, '_', ' ')))}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Sucursal Base <span class="text-danger">*</span></label>
                        <select th:field="*{sucursalId}" class="form-select" th:required="${!isAdminSede}" th:disabled="${isAdminSede}">
                            <option value="">-- Seleccione --</option>
                            <option th:each="suc : ${sucursales}" th:value="${suc.id}" th:text="${suc.nombre}"></option>
                        </select>
                        <input type="hidden" th:if="${isAdminSede}" th:field="*{sucursalId}">
                    </div>
                    <div class="col-md-4" id="divEspecialidad" style="display: none;">
                        <label class="form-label fw-bold">Especialidad Médica</label>
                        <select th:field="*{especialidadId}" class="form-select">
                            <option value="">-- Ninguna --</option>
                            <option th:each="esp : ${especialidades}" th:value="${esp.id}" th:text="${esp.nombre}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-warning text-dark btn-lg fw-bold">
                        <i th:class="${editMode != null && editMode} ? 'bi bi-save' : 'bi bi-person-check-fill'"></i> 
                        <span th:text="${editMode != null && editMode} ? 'Guardar Cambios' : 'Registrar Empleado'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleEspecialidad() {
        var rol = $("#selectRol option:selected").text();
        if(rol.includes('Medico') || rol.includes('Médico') || rol.includes('MEDICO')) {
            $('#divEspecialidad').slideDown();
        } else {
            $('#divEspecialidad').slideUp();
            if(!$('#especialidadId').data('keep')) {
                $('#especialidadId').val(''); // Reset
            }
        }
    }

    function generarUsername() {
        var nombreCompleto = $('#nombreCompletoInput').val().trim().toLowerCase();
        if(!nombreCompleto) return;
        
        var partes = nombreCompleto.split(' ');
        var username = "";
        
        if (partes.length >= 2) {
            username = partes[0].charAt(0) + partes[1];
        } else {
            username = partes[0];
        }
        
        username = username.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
        var randomNum = Math.floor(Math.random() * 90 + 10);
        username = username.substring(0, 7) + randomNum;
        
        $('#usernameInput').val(username);
    }

    $(document).ready(function() {
        toggleEspecialidad();
        
        $('#nombreCompletoInput').on('blur', function() {
            var input = $('#usernameInput');
            if (input.length && !input.prop('readonly') && !input.val()) {
                generarUsername();
            }
        });
    });
</script>
</body>
</html>
