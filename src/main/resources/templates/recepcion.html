<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recepción - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Recepción y Verificación de Cita</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card card-panel p-3 mb-3">
        <form th:action="@{/recepcion}" method="get" class="d-flex gap-2">
            <input type="text" name="dpi" class="form-control" placeholder="Ingresa el DPI del paciente"
                   th:value="${dpiBuscado}" maxlength="13"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 13)">
            <button type="submit" class="btn btn-sistema"><i class="bi bi-search"></i> Buscar</button>
        </form>
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <div class="card card-panel p-3" th:if="${citas != null}">
        <table class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Médico</th>
                <th>Especialidad</th>
                <th>Fecha y hora</th>
                <th>Estado</th>
                <th>Llegada</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.medicoNombre}"></td>
                <td th:text="${cita.especialidadNombre}"></td>
                <td th:text="${cita.fechaHora}"></td>
                <td>
                            <span class="badge badge-estado"
                                  th:classappend="${cita.estado == 'PAGADA'} ? 'bg-primary' :
                                                   (${cita.estado == 'RESERVADA'} ? 'bg-warning text-dark' :
                                                   (${cita.estado == 'ATENDIDA'} ? 'bg-success' : 'bg-secondary'))"
                                  th:text="${cita.estado}">
                            </span>
                </td>
                <td>
                            <span class="badge badge-estado" th:classappend="${cita.verificada} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${cita.verificada} ? 'Verificada' : 'Pendiente'">
                            </span>
                </td>
                <td>
                    <form th:if="${!cita.verificada}" th:action="@{'/recepcion/' + ${cita.id} + '/verificar'}" method="post">
                        <input type="hidden" name="dpi" th:value="${dpiBuscado}">
                        <button type="submit" class="btn btn-sistema btn-sm">
                            <i class="bi bi-check-circle"></i> Verificar llegada
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="6" class="text-center text-muted py-4">No se encontraron citas para este DPI.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
