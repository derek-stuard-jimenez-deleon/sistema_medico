<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Pacientes</h4>
        <div>
            <a th:href="@{/pacientes/nuevo}" class="btn btn-sistema btn-sm me-2">
                <i class="bi bi-plus-circle"></i> Nuevo Paciente
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

    <div class="card card-panel p-3">
        <table class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>DPI</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Usuario</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="paciente : ${pacientes}">
                <td th:text="${paciente.nombreCompleto}"></td>
                <td th:text="${paciente.dpi}"></td>
                <td th:text="${paciente.telefono}"></td>
                <td th:text="${paciente.correo}"></td>
                <td th:text="${paciente.username}"></td>
                <td>
                            <span class="badge badge-estado"
                                  th:classappend="${paciente.activo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${paciente.activo} ? 'Activo' : 'Inactivo'">
                            </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pacientes)}">
                <td colspan="6" class="text-center text-muted py-4">No hay pacientes registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
