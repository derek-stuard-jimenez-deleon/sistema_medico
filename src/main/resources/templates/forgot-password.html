<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="pantalla-login">
<div class="card card-login">
    <div class="card-body p-5">
        <div class="icono-login"><i class="bi bi-key-fill"></i></div>
        <h2 class="text-center mb-1 fw-bold">Recuperar contraseña</h2>
        <p class="text-center text-muted mb-4">Ingresa tu usuario o correo</p>

        <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-4">
                <label class="form-label">Usuario o correo</label>
                <input type="text" name="usernameOCorreo" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-sistema w-100">Enviar instrucciones</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}" class="text-decoration-none">
                <i class="bi bi-arrow-left"></i> Volver al login
            </a>
        </div>
    </div>
</div>
</body>
</html>
