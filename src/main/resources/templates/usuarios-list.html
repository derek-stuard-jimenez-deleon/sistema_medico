<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Empleados - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Médico 2026</a>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h3 class="fw-bold"><i class="bi bi-people-fill"></i> Catálogo de Usuarios (Empleados)</h3>
        </div>
        <div class="col text-end">
            <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-warning text-dark fw-bold shadow-sm">
                <i class="bi bi-person-plus-fill me-1"></i> Crear Empleado
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-house-door-fill"></i> Dashboard
            </a>
        </div>
    </div>

    <!-- Buscador y Filtros -->
    <div class="card border-0 shadow-sm mb-3 bg-white">
        <div class="card-body py-3">
            <div class="row g-2 align-items-center">
                <div th:class="${!isAdminSede} ? 'col-md-4' : 'col-md-6'">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" id="filtroTexto" class="form-control" placeholder="Buscar por nombre o username..." onkeyup="filtrarTabla()">
                    </div>
                </div>
                <div th:class="${!isAdminSede} ? 'col-md-4' : 'col-md-6'">
                    <select id="filtroRol" class="form-select" onchange="filtrarTabla()">
                        <option value="TODOS">Todos los Roles</option>
                    </select>
                </div>
                <div class="col-md-4" th:if="${!isAdminSede}">
                    <select id="filtroSede" class="form-select" onchange="filtrarTabla()">
                        <option value="TODOS">Todas las Sucursales</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="tablaUsuarios">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Nombre Completo</th>
                            <th>Rol</th>
                            <th>Sucursal Base</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${usuarios}">
                            <td class="text-muted fw-bold" th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.nombreCompleto}"></td>
                            <td><span class="badge bg-secondary" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(user.rolNombre, '_', ' ')))}"></span></td>
                            <td th:text="${user.sucursalNombre}"></td>
                            <td>
                                <span th:if="${user.activo}" class="badge bg-success">Activo</span>
                                <span th:unless="${user.activo}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/usuarios/editar/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <form th:action="@{/admin/usuarios/eliminar/{id}(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Seguro que desea dar de baja este usuario? Ya no podrá iniciar sesión.');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Dar de Baja">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const rolesSet = new Set();
        const sedesSet = new Set();
        
        const filas = document.querySelectorAll("#tablaUsuarios tbody tr");
        
        // Extraer roles y sedes únicos de la tabla
        filas.forEach(fila => {
            const rol = fila.querySelector("td:nth-child(4)").textContent.trim();
            const sede = fila.querySelector("td:nth-child(5)").textContent.trim();
            if(rol) rolesSet.add(rol);
            if(sede) sedesSet.add(sede);
        });

        // Llenar el select de roles
        const selectRol = document.getElementById("filtroRol");
        Array.from(rolesSet).sort().forEach(rol => {
            const option = document.createElement("option");
            option.value = rol;
            option.textContent = rol;
            selectRol.appendChild(option);
        });

        // Llenar el select de sedes
        const selectSede = document.getElementById("filtroSede");
        if (selectSede) {
            Array.from(sedesSet).sort().forEach(sede => {
                const option = document.createElement("option");
                option.value = sede;
                option.textContent = sede;
                selectSede.appendChild(option);
            });
        }
    });

    function filtrarTabla() {
        const texto = document.getElementById("filtroTexto").value.toLowerCase();
        const rolSeleccionado = document.getElementById("filtroRol").value;
        const selectSede = document.getElementById("filtroSede");
        const sedeSeleccionada = selectSede ? selectSede.value : "TODOS";
        
        const filas = document.querySelectorAll("#tablaUsuarios tbody tr");
        
        filas.forEach(fila => {
            const username = fila.querySelector("td:nth-child(2)").textContent.toLowerCase();
            const nombre = fila.querySelector("td:nth-child(3)").textContent.toLowerCase();
            const rol = fila.querySelector("td:nth-child(4)").textContent.trim();
            const sede = fila.querySelector("td:nth-child(5)").textContent.trim();

            const pasaTexto = username.includes(texto) || nombre.includes(texto);
            const pasaRol = (rolSeleccionado === "TODOS" || rol === rolSeleccionado);
            const pasaSede = (sedeSeleccionada === "TODOS" || sede === sedeSeleccionada);

            if (pasaTexto && pasaRol && pasaSede) {
                fila.style.display = "";
            } else {
                fila.style.display = "none";
            }
        });
    }
</script>
</body>
</html>
