<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consulta Médica - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Consulta Médica</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <p class="text-muted">Pacientes con signos vitales tomados, listos para atención.</p>

    <div class="card card-panel p-4 text-center" th:if="${#lists.isEmpty(citas)}">
        <p class="text-muted mb-0">No tienes citas pendientes de consulta en este momento.</p>
    </div>

    <div class="accordion" id="acordeonConsultas" th:unless="${#lists.isEmpty(citas)}">
        <div class="accordion-item" th:each="cita : ${citas}">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        th:data-bs-target="'#colapso-' + ${cita.id}">
                    <span th:text="'Cita #' + ${cita.id} + ' — ' + ${cita.pacienteNombre} + ' (' + ${cita.especialidadNombre} + ')'"></span>
                </button>
            </h2>
            <div th:id="'colapso-' + ${cita.id}" class="accordion-collapse collapse" data-bs-parent="#acordeonConsultas">
                <div class="accordion-body">
                    <form th:action="@{/consulta-medica/{id}/guardar(id=${cita.id})}" method="post" class="row g-3">

                        <div class="col-12">
                            <label class="form-label">Motivo de consulta</label>
                            <textarea name="motivoConsulta" class="form-control" rows="2" maxlength="2000" required></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Hallazgos clínicos</label>
                            <textarea name="hallazgosClinicos" class="form-control" rows="3" maxlength="5000" required></textarea>
                        </div>

                        <div class="col-md-8">
                            <label class="form-label">Diagnóstico <small class="text-muted">(obligatorio solo para cerrar)</small></label>
                            <textarea name="diagnostico" class="form-control" rows="2" maxlength="5000"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Código CIE-10</label>
                            <input type="text" name="codigoCie10" class="form-control" maxlength="10" placeholder="Ej. J06.9">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Plan de tratamiento</label>
                            <textarea name="planTratamiento" class="form-control" rows="3" maxlength="5000" required></textarea>
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-2">
                            <button type="submit" name="cerrar" value="false" class="btn btn-outline-secondary">
                                <i class="bi bi-save"></i> Guardar sin cerrar
                            </button>
                            <button type="submit" name="cerrar" value="true" class="btn btn-sistema">
                                <i class="bi bi-check-circle"></i> Cerrar consulta
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
