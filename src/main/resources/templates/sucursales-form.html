<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Sucursal - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Médico 2026</a>
    </div>
</nav>

<div class="container mt-4 mb-5" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i th:class="${editMode != null && editMode} ? 'bi bi-hospital text-warning' : 'bi bi-hospital text-success'"></i>
            <span th:text="${editMode != null && editMode} ? ' Editar Sucursal' : ' Nueva Sucursal'"></span>
        </h3>
        <a th:href="@{/catalogos/sucursales}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${editMode != null && editMode} ? @{/catalogos/sucursales/actualizar/{id}(id=${sucursalId})} : @{/catalogos/sucursales/guardar}" th:object="${sucursalRequest}" method="post">
                
                <h5 class="fw-bold text-primary mb-3">Información de la Sucursal</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre Comercial <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Sede Central">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Teléfono de Contacto</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej: 22345678">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12">
                        <label class="form-label fw-bold">Dirección Física <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{direccion}" class="form-control" required placeholder="Ej: Zona 1, Ciudad de Guatemala">
                    </div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-8">
                        <label class="form-label fw-bold">Horario de Atención</label>
                        <input type="text" th:field="*{horarioAtencion}" class="form-control" placeholder="Ej: L-V 8:00-17:00, Sáb 8:00-12:00">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Estado</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" role="switch" th:field="*{activo}" id="activoSwitch">
                            <label class="form-check-label" for="activoSwitch">Activa / Operativa</label>
                        </div>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">
                        <i th:class="${editMode != null && editMode} ? 'bi bi-save' : 'bi bi-plus-circle'"></i> 
                        <span th:text="${editMode != null && editMode} ? 'Guardar Cambios' : 'Registrar Sucursal'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
