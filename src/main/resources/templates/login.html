<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="pantalla-login">
<div class="card card-login">
    <div class="card-body p-5">
        <div class="icono-login">
            <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h2 class="text-center mb-1 fw-bold">Sistema Medico 2026</h2>
        <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>

        <!-- Bloque de Alerta de Error Modificado -->
        <div class="alert alert-danger d-flex align-items-center gap-2" th:if="${errorMessage != null}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="text-end mb-3">
                <a th:href="@{/forgot-password}" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn btn-sistema w-100">Ingresar</button>
        </form>
    </div>
</div>
</body>
</html>
