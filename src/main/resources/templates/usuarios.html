<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Usuarios</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card card-panel p-3">
        <table class="table table-sistema align-middle">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Sucursal</th>
                <th>Especialidad</th>
                <th>Teléfono</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nombreCompleto}"></td>
                <td th:text="${usuario.username}"></td>
                <td>
                    <span class="badge bg-dark-subtle text-dark-emphasis" th:text="${usuario.rolNombre}"></span>
                </td>
                <td th:text="${usuario.sucursalNombre}"></td>
                <td th:text="${usuario.especialidadNombre} ?: '—'"></td>
                <td th:text="${usuario.telefono} ?: '—'"></td>
                <td>
                            <span class="badge badge-estado"
                                  th:classappend="${usuario.activo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">
                            </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="7" class="text-center text-muted py-4">No hay usuarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
