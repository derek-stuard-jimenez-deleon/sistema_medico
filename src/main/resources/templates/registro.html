<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Nuevo Paciente - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="card card-panel p-4 mx-auto" style="max-width: 720px;">
        <h4 class="fw-bold mb-3">Formulario de Registro</h4>

        <!-- Alerta para errores de negocio (ej: DPI ya existe) -->
        <div class="alert alert-danger" th:if="${errorRegistro}" th:text="${errorRegistro}"></div>

        <form th:action="@{/registro}" th:object="${pacienteRequest}" method="post">
            <div class="row g-3">
                <div class="col-12">
                    <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                </div>
                <div class="col-md-6">
                    <label for="dpi" class="form-label">DPI</label>
                    <input type="text" id="dpi" th:field="*{dpi}" class="form-control"
                           th:classappend="${#fields.hasErrors('dpi')} ? 'is-invalid' : ''"
                           maxlength="13" inputmode="numeric" pattern="[0-9]{13}"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dpi')}" th:errors="*{dpi}"></div>
                </div>
                <div class="col-md-6">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="form-control"
                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                           maxlength="8" inputmode="numeric" pattern="[0-9]{8}"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                </div>
                <div class="col-12">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <input type="email" id="correo" th:field="*{correo}" class="form-control"
                           th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>
                <div class="col-md-6">
                    <label for="username" class="form-label">Nombre de Usuario</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                           minlength="8" maxlength="9">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="col-md-6">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group"> <!-- Agregado para el botón de generar -->
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               minlength="12">
                        <button class="btn btn-outline-secondary" type="button" id="generatePasswordBtn">Generar</button>
                        <!-- Botón para mostrar/ocultar contraseña -->
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordVisibility">
                            <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                        </button>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                </div>
                <div class="col-12">
                    <label for="numeroSeguro" class="form-label">Número de Afiliado (Opcional)</label>
                    <input type="text" id="numeroSeguro" th:field="*{numeroSeguro}" class="form-control"
                           th:classappend="${#fields.hasErrors('numeroSeguro')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroSeguro')}" th:errors="*{numeroSeguro}"></div>
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-sistema">Registrarse</button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const nombreCompletoInput = document.getElementById('nombreCompleto');
        const dpiInput = document.getElementById('dpi');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const generatePasswordBtn = document.getElementById('generatePasswordBtn');
        const togglePasswordVisibilityBtn = document.getElementById('togglePasswordVisibility');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        function generateUsername() {
            const nombre = nombreCompletoInput.value.trim();
            const dpi = dpiInput.value.trim();

            if (nombre.length >= 3 && dpi.length >= 4) {
                let generatedUsername = '';
                const parts = nombre.split(' ');
                if (parts.length > 0 && parts[0].length > 0) {
                    generatedUsername += parts[0].substring(0, 3).toLowerCase();
                }
                if (parts.length > 1 && parts[1].length > 0) {
                    generatedUsername += parts[1].substring(0, 3).toLowerCase();
                }
                generatedUsername += dpi.substring(dpi.length - 4);

                // Asegurarse de que el username tenga entre 8 y 9 caracteres
                if (generatedUsername.length > 9) {
                    generatedUsername = generatedUsername.substring(0, 9);
                } else if (generatedUsername.length < 8) {
                    // Si es muy corto, rellenar con caracteres aleatorios o parte del nombre
                    while (generatedUsername.length < 8) {
                        generatedUsername += String.fromCharCode(97 + Math.floor(Math.random() * 26)); // Añadir letra aleatoria
                    }
                }

                usernameInput.value = generatedUsername;
            } else {
                usernameInput.value = '';
            }
        }

        function generateSecurePassword() {
            const length = 12;
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
            let password = "";
            for (let i = 0, n = charset.length; i < length; ++i) {
                password += charset.charAt(Math.floor(Math.random() * n));
            }
            passwordInput.value = password;
        }

        function togglePasswordVisibility() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePasswordIcon.classList.remove("bi-eye-slash");
                togglePasswordIcon.classList.add("bi-eye");
            } else {
                passwordInput.type = "password";
                togglePasswordIcon.classList.remove("bi-eye");
                togglePasswordIcon.classList.add("bi-eye-slash");
            }
        }

        // Event Listeners para auto-generar username
        nombreCompletoInput.addEventListener('input', generateUsername);
        dpiInput.addEventListener('input', generateUsername);

        // Event Listener para generar contraseña
        generatePasswordBtn.addEventListener('click', generateSecurePassword);

        // Event Listener para mostrar/ocultar contraseña
        togglePasswordVisibilityBtn.addEventListener('click', togglePasswordVisibility);

        // Si el DPI ya viene pre-llenado (desde el modal), generar el username al cargar
        if (dpiInput.value.length === 13 && nombreCompletoInput.value.length > 0) {
            generateUsername();
        }
    });
</script>
</body>
</html>
