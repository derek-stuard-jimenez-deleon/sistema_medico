<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema Medico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="card card-panel p-4">
        <h4 class="fw-bold mb-1">Bienvenido al sistema</h4>
        <p class="text-muted">Selecciona una opción para comenzar.</p>
        <div>
            <!-- Botón para Pacientes, Admin y Médicos -->
            <a th:href="@{/paciente/portal/citas}" class="btn btn-sistema" sec:authorize="hasAnyRole('PACIENTE')">
                <i class="bi bi-calendar-check"></i> Mis Citas
            </a>
            <a th:href="@{/citas}" class="btn btn-sistema" sec:authorize="hasAnyRole('ADMIN', 'MEDICO')">
                <i class="bi bi-calendar-check"></i> Ver Citas
            </a>

            <!-- Botón para Admin/Recepcionista -->
            <a th:href="@{/pacientes}" class="btn btn-sistema ms-2" sec:authorize="hasAnyRole('ADMIN', 'RECEPCIONISTA')">
                <i class="bi bi-people"></i> Pacientes
            </a>

            <!-- Botón solo para Admin -->
            <a th:href="@{/usuarios}" class="btn btn-sistema ms-2" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-person-badge"></i> Usuarios
            </a>

            <!-- Botón para Cajero -->
            <a th:href="@{/caja/citas}" class="btn btn-sistema ms-2" sec:authorize="hasRole('CAJERO')">
                <i class="bi bi-receipt"></i> Cobro Citas
            </a>

            <!-- Botón para Cajero -->
            <a th:href="@{/caja/laboratorio}" class="btn btn-sistema ms-2" sec:authorize="hasRole('CAJERO')">
                <i class="bi bi-cash-coin"></i> Cobro Laboratorio
            </a>

            <!-- Botón para Recepcionista -->
            <a th:href="@{/recepcion}" class="btn btn-sistema ms-2" sec:authorize="hasRole('RECEPCIONISTA')">
                <i class="bi bi-clipboard-check"></i> Recepción
            </a>

            <!-- Botón para Admin/Farmacia -->
            <a th:href="@{/inventario/movimientos}" class="btn btn-sistema ms-2" sec:authorize="hasAnyRole('ADMIN', 'FARMACEUTICO')">
                <i class="bi bi-box-seam"></i> Bitácora Inventario
            </a>

            <!-- Botón para Enfermería -->
            <a th:href="@{/enfermeria}" class="btn btn-sistema ms-2" sec:authorize="hasAnyRole('ADMIN', 'ENFERMERO', 'MEDICO')">
                <i class="bi bi-clipboard2-pulse"></i> Signos Vitales
            </a>

            <!-- Botón para Médico -->
            <a th:href="@{/consulta-medica}" class="btn btn-sistema ms-2" sec:authorize="hasAnyRole('ADMIN', 'MEDICO')">
                <i class="bi bi-file-earmark-medical"></i> Consulta Médica
            </a>

        </div>
    </div>
</div>
</body>
</html>
