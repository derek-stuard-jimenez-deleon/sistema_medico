<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Sistema Medico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
  <div class="card card-panel p-4">
    <h4 class="fw-bold mb-1">Bienvenido al sistema</h4>
    <p class="text-muted">Selecciona una opción para comenzar.</p>
    <div>
        <a th:href="@{/citas}" class="btn btn-sistema">
            <i class="bi bi-calendar-check"></i> Ver Citas
        </a>
    </div>
  </div>
</div>
</body>
</html>
