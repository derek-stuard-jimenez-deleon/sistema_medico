<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Toma de Signos Vitales - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Toma de Signos Vitales</h4>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <div class="card card-panel p-3 mb-3">
        <form th:action="@{/enfermeria}" method="get" class="d-flex gap-2">
            <input type="text" name="dpi" class="form-control"
                   placeholder="Ingresa DPI del paciente para buscar sus citas pagadas"
                   th:value="${dpiBuscado}" maxlength="13" inputmode="numeric" required>
            <button type="submit" class="btn btn-sistema"><i class="bi bi-search"></i> Buscar</button>
        </form>
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <div th:if="${citas != null}">
        <h5 class="mb-3">Citas pendientes de signos vitales para el DPI: <span class="fw-bold" th:text="${dpiBuscado}"></span></h5>

        <div class="card card-panel p-4 text-center" th:if="${#lists.isEmpty(citas)}">
            <p class="text-muted mb-0">No hay citas pagadas pendientes de signos vitales para este DPI.</p>
        </div>

        <div class="accordion" id="acordeonCitas" th:unless="${#lists.isEmpty(citas)}">
            <div class="accordion-item" th:each="cita, iter : ${citas}">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            th:data-bs-target="'#colapso-' + ${cita.id}">
                        <span th:text="'Cita #' + ${cita.id} + ' — ' + ${cita.especialidadNombre} + ' — ' + ${cita.medicoNombre}"></span>
                    </button>
                </h2>
                <div th:id="'colapso-' + ${cita.id}" class="accordion-collapse collapse" data-bs-parent="#acordeonCitas">
                    <div class="accordion-body">
                        <form th:action="@{/enfermeria/{id}/registrar(id=${cita.id})}" method="post"
                              class="row g-3 formulario-signos" novalidate>
                            <input type="hidden" name="dpi" th:value="${dpiBuscado}">

                            <div class="col-md-6">
                                <label class="form-label">Presión sistólica (mmHg)</label>
                                <input type="number" name="presionSistolica" class="form-control campo-vital"
                                       data-min-normal="90" data-max-normal="120" data-etiqueta="Presión sistólica"
                                       min="60" max="250" required>
                                <div class="form-text text-warning alerta-clinica d-none"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Presión diastólica (mmHg)</label>
                                <input type="number" name="presionDiastolica" class="form-control campo-vital"
                                       data-min-normal="60" data-max-normal="80" data-etiqueta="Presión diastólica"
                                       min="40" max="150" required>
                                <div class="form-text text-warning alerta-clinica d-none"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Temperatura (°C)</label>
                                <input type="number" step="0.1" name="temperatura" class="form-control campo-vital"
                                       data-min-normal="36.1" data-max-normal="37.2" data-etiqueta="Temperatura"
                                       min="34.0" max="42.0" required>
                                <div class="form-text text-warning alerta-clinica d-none"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Peso (kg)</label>
                                <input type="number" step="0.01" name="peso" class="form-control" min="0.5" max="300" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Talla (cm)</label>
                                <input type="number" step="0.01" name="talla" class="form-control" min="30" max="250" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Frecuencia cardíaca (lpm)</label>
                                <input type="number" name="frecuenciaCardiaca" class="form-control campo-vital"
                                       data-min-normal="60" data-max-normal="100" data-etiqueta="Frecuencia cardíaca"
                                       min="30" max="220" required>
                                <div class="form-text text-warning alerta-clinica d-none"></div>
                            </div>

                            <!-- Resumen de alertas clínicas en tiempo real (RN-CU07-06) -->
                            <div class="col-12">
                                <div class="alert alert-warning d-none resumen-alertas" role="alert">
                                    <i class="bi bi-exclamation-triangle-fill"></i>
                                    <strong>Valores fuera de rango clínico normal:</strong>
                                    <ul class="mb-0 lista-alertas"></ul>
                                </div>
                            </div>

                            <!-- Indicador de emergencia (FA01) -->
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch"
                                           name="esEmergencia" value="true" id="emergencia-${cita.id}">
                                    <label class="form-check-label text-danger fw-bold" th:for="'emergencia-' + ${cita.id}">
                                        <i class="bi bi-exclamation-octagon-fill"></i> ¿Es Emergencia?
                                    </label>
                                    <div class="form-text">
                                        Si se activa, el paciente pasará directamente a consulta médica sin volver a sala de espera.
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-sistema">
                                    <i class="bi bi-clipboard2-pulse"></i> Registrar Signos Vitales
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // RN-CU07-06: alertas clínicas en tiempo real (valores dentro del rango de
    // captura pero fuera del rango clínico normal). No bloquea el envío.
    document.querySelectorAll('.formulario-signos').forEach(function (form) {
        var camposVitales = form.querySelectorAll('.campo-vital');
        var resumen = form.querySelector('.resumen-alertas');
        var listaResumen = form.querySelector('.lista-alertas');

        function evaluarCampo(input) {
            var valor = parseFloat(input.value);
            var contenedorAlerta = input.parentElement.querySelector('.alerta-clinica');
            if (isNaN(valor)) {
                contenedorAlerta.classList.add('d-none');
                return null;
            }
            var min = parseFloat(input.dataset.minNormal);
            var max = parseFloat(input.dataset.maxNormal);
            if (valor < min || valor > max) {
                contenedorAlerta.textContent = 'Fuera del rango clínico normal (' + min + ' - ' + max + ')';
                contenedorAlerta.classList.remove('d-none');
                return input.dataset.etiqueta + ': ' + valor + ' (normal ' + min + '-' + max + ')';
            } else {
                contenedorAlerta.classList.add('d-none');
                return null;
            }
        }

        function actualizarResumen() {
            var alertas = [];
            camposVitales.forEach(function (input) {
                var alerta = evaluarCampo(input);
                if (alerta) alertas.push(alerta);
            });

            if (alertas.length > 0) {
                listaResumen.innerHTML = '';
                alertas.forEach(function (texto) {
                    var li = document.createElement('li');
                    li.textContent = texto;
                    listaResumen.appendChild(li);
                });
                resumen.classList.remove('d-none');
            } else {
                resumen.classList.add('d-none');
            }
        }

        camposVitales.forEach(function (input) {
            input.addEventListener('input', actualizarResumen);
        });
    });
</script>
</body>
</html>
