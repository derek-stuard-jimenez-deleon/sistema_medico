<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido al Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5 text-center">
    <div class="card card-panel p-5 mx-auto" style="max-width: 720px;">
        <h1 class="fw-bold">Bienvenido al Portal de Pacientes</h1>
        <p class="lead text-muted">Su salud, nuestra prioridad. Agende su cita de forma rápida y segura.</p>
        <hr class="my-4">
        <div class="d-grid gap-2 col-6 mx-auto">
            <button type="button" class="btn btn-sistema btn-lg" data-bs-toggle="modal" data-bs-target="#verificarDpiModal">
                <i class="bi bi-calendar-plus"></i> Agendar Cita
            </button>
        </div>
    </div>
</main>

<!-- Modal de Verificación de DPI -->
<div class="modal fade" id="verificarDpiModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/verificar-dpi}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Verificar Registro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">

                    <!-- ===================== INICIO DE CAMBIOS ===================== -->

                    <!-- Bloque de Alertas del Modal -->
                    <div class="alert alert-danger" th:if="${errorModal}" th:text="${errorModal}"></div>
                    <div class="alert alert-info" th:if="${infoModal}" th:text="${infoModal}"></div>

                    <!-- ====================== FIN DE CAMBIOS ======================= -->

                    <p class="text-muted">Ingrese su número de DPI para verificar si está registrado en el sistema.</p>
                    <div class="mb-3">
                        <label for="dpi" class="form-label">Número de DPI</label>
                        <input type="text" id="dpi" name="dpi" class="form-control"
                               maxlength="13" inputmode="numeric" pattern="[0-9]{13}"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                               required>
                        <div class="form-text">13 dígitos, sin guiones ni espacios.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-sistema">Verificar DPI</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
