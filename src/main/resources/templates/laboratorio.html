<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height: calc(100vh - 56px); background-color: #f8f9fa; }
        .estado-badge { font-size: 0.85em; padding: 0.35em 0.65em; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Médico 2026</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" th:text="${#authentication.name}">usuario</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Contenido Principal -->
        <main class="col-md-10 ms-sm-auto col-lg-12 px-md-4 mt-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">Órdenes de Laboratorio</h1>
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver al Dashboard</a>
            </div>

            <div th:if="${errorNegocio}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorNegocio}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${mensajeExito}">Éxito</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>Nro. Orden</th>
                                <th>Paciente</th>
                                <th>DPI</th>
                                <th>Médico Solicitante</th>
                                <th>Monto Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="orden : ${ordenes}">
                                <td><strong th:text="'#' + ${orden.id}">#1</strong></td>
                                <td th:text="${orden.paciente.nombreCompleto}">Paciente</td>
                                <td th:text="${orden.paciente.dpi}">DPI</td>
                                <td th:text="${orden.medico.nombreCompleto}">Médico</td>
                                <td th:text="'Q' + ${orden.montoTotal}">Q0.00</td>
                                <td>
                                    <span th:if="${orden.estado.name() == 'PENDIENTE'}" class="badge bg-warning text-dark estado-badge">PENDIENTE DE PAGO</span>
                                    <span th:if="${orden.estado.name() == 'EN_PROCESO'}" class="badge bg-primary estado-badge">EN PROCESO</span>
                                    <span th:if="${orden.estado.name() == 'COMPLETADA'}" class="badge bg-success estado-badge">COMPLETADA</span>
                                    <span th:if="${orden.estado.name() == 'CANCELADA'}" class="badge bg-danger estado-badge">CANCELADA</span>
                                </td>
                                <td>
                                    <a th:href="@{/laboratorio/orden/{id}(id=${orden.id})}" class="btn btn-sm btn-outline-primary">
                                        Ver Detalle <i class="bi bi-chevron-right"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(ordenes)}">
                                <td colspan="7" class="text-center text-muted py-4">No hay órdenes de laboratorio registradas.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
