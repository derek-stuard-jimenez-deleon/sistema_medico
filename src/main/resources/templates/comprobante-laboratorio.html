<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprobante de Laboratorio - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <style>
        @media print {
            .navbar, .no-print { display: none !important; }
            body { background: #fff; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container mt-4" th:if="${pago != null and orden != null}">
    <div class="card card-panel p-4 mx-auto" style="max-width: 720px;">
        <div class="text-center border-bottom pb-3 mb-3">
            <i class="bi bi-check-circle-fill text-success fs-1"></i>
            <h4 class="fw-bold mt-2">¡Pago de laboratorio registrado!</h4>
            <p class="text-muted mb-0">La orden ahora está en proceso.</p>
        </div>
        <dl class="row mb-0">
            <dt class="col-sm-5">Transacción</dt><dd class="col-sm-7" th:text="${pago.numeroTransaccion}"></dd>
            <dt class="col-sm-5">Fecha y hora</dt><dd class="col-sm-7" th:text="${pago.fechaHora}"></dd>
            <dt class="col-sm-5">Paciente</dt><dd class="col-sm-7" th:text="${orden.pacienteNombre}"></dd>
            <dt class="col-sm-5">DPI</dt><dd class="col-sm-7" th:text="${orden.pacienteDpi}"></dd>
            <dt class="col-sm-5">Orden</dt><dd class="col-sm-7" th:text="'#' + ${orden.id}"></dd>
            <dt class="col-sm-5">Método de pago</dt><dd class="col-sm-7" th:text="${pago.metodoPago}"></dd>
            <dt class="col-sm-5" th:if="${pago.montoRecibido != null}">Monto recibido</dt><dd class="col-sm-7" th:if="${pago.montoRecibido != null}" th:text="'Q' + ${pago.montoRecibido}"></dd>
            <dt class="col-sm-5" th:if="${pago.cambio != null}">Cambio</dt><dd class="col-sm-7" th:if="${pago.cambio != null}" th:text="'Q' + ${pago.cambio}"></dd>
            <dt class="col-sm-5">Total pagado</dt><dd class="col-sm-7 fw-bold" th:text="'Q' + ${pago.monto}"></dd>
        </dl>
        <div class="border-top pt-3 mt-3 d-flex gap-2 justify-content-end no-print">
            <a th:href="@{/dashboard}" class="btn btn-outline-dark"><i class="bi bi-arrow-left"></i> Volver</a>
            <a th:href="@{/caja/laboratorio}" class="btn btn-outline-secondary"><i class="bi bi-plus-circle"></i> Nuevo cobro</a>
            <button type="button" class="btn btn-sistema" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
        </div>
    </div>
</main>
<main class="container mt-4" th:unless="${pago != null and orden != null}">
    <div class="alert alert-warning">No hay un comprobante de pago para mostrar.</div>
    <a th:href="@{/caja/laboratorio}" class="btn btn-sistema">Volver a caja</a>
</main>
</body>
</html>
