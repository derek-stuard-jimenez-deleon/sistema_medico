<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Sucursales - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Médico 2026</a>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h3 class="fw-bold"><i class="bi bi-hospital"></i> Catálogo de Sucursales / Clínicas</h3>
        </div>
        <div class="col text-end">
            <a th:href="@{/catalogos/sucursales/nuevo}" class="btn btn-warning text-dark fw-bold shadow-sm">
                <i class="bi bi-plus-circle me-1"></i> Nueva Sucursal
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-house-door-fill"></i> Dashboard
            </a>
        </div>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Horarios</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sucursal : ${sucursales}">
                            <td class="text-muted fw-bold" th:text="${sucursal.id}"></td>
                            <td th:text="${sucursal.nombre}"></td>
                            <td th:text="${sucursal.direccion}"></td>
                            <td th:text="${sucursal.telefono}"></td>
                            <td th:text="${sucursal.horarioAtencion}"></td>
                            <td>
                                <span th:if="${sucursal.activo}" class="badge bg-success">Activa</span>
                                <span th:unless="${sucursal.activo}" class="badge bg-danger">Inactiva</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/catalogos/sucursales/editar/{id}(id=${sucursal.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <form th:action="@{/catalogos/sucursales/eliminar/{id}(id=${sucursal.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Seguro que desea eliminar esta sucursal?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
