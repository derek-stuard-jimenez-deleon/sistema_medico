<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Roles - Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Médico 2026</a>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h3 class="fw-bold"><i class="bi bi-person-badge"></i> Catálogo de Roles</h3>
        </div>
        <div class="col text-end">
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-house-door-fill"></i> Dashboard
            </a>
        </div>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre de Rol</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rol : ${roles}">
                            <td class="text-muted fw-bold" th:text="${rol.id}"></td>
                            <td><span class="badge bg-secondary" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(rol.nombre, '_', ' ')))}"></span></td>
                            <td th:text="${rol.descripcion}"></td>
                            <td>
                                <span th:if="${rol.activo}" class="badge bg-success">Activo</span>
                                <span th:unless="${rol.activo}" class="badge bg-danger">Inactivo</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
