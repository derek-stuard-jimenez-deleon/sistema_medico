<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Especialidad - Sistema Medico 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold"><i class="bi bi-file-earmark-plus"></i> Nueva Especialidad</h3>
        <a th:href="@{/catalogos/especialidades}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/catalogos/especialidades/guardar}" th:object="${especialidadRequest}" method="post">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de la Especialidad <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej. Oftalmolog?a">
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción <span class="text-danger">*</span></label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" required placeholder="Describe brevemente la especialidad..."></textarea>
                </div>
                
                <div class="mb-4 form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{activo}" id="activoSwitch">
                    <label class="form-check-label fw-bold" for="activoSwitch">Especialidad Activa (Visible para pacientes)</label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-sistema btn-lg">
                        <i class="bi bi-save"></i> Guardar Especialidad
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
